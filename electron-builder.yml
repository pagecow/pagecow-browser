appId: com.pagecow.browser
productName: PageCow
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - blocked.json
  - package.json
  - build/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
# electron-updater reads app-update.yml (embedded into the app) and the
# latest*.yml files next to the installers. The build never publishes by
# itself (CI passes --publish never); the release workflow uploads the files
# to the GitHub Release.
publish:
  provider: github
  owner: pagecow
  repo: pagecow-browser
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # electron-updater downloads the zip for automatic updates on macOS; the
    # dmg stays the manual-install download.
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - nsis
linux:
  category: Network
  icon: build/icons
  executableName: pagecow-browser
  # Register as a web browser so the OS lets the user pick PageCow as the
  # default handler for http/https links. Exec defaults to "%U" which forwards
  # the clicked URL as a CLI argument; the main process parses it from argv.
  mimeTypes:
    - x-scheme-handler/http
    - x-scheme-handler/https
  desktop:
    entry:
      StartupWMClass: pagecow-browser
      Categories: Network;WebBrowser;
  target:
    - AppImage
    - deb
deb:
  afterInstall: scripts/linux/debian-postinst.sh
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Keep the installer name free of spaces: GitHub Actions' artifact
  # upload/download step rewrites spaces, which renamed the released file to
  # "PageCow.Setup.<version>.exe" and broke the site's download link. This
  # name is also what electron-builder writes into latest.yml, so the update
  # metadata and the release asset always agree.
  artifactName: "${productName}-Setup-${version}.${ext}"
